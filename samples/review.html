<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MILOQEN · 两个独立素材样片验收</title><style>*{box-sizing:border-box}body{margin:0;background:#080d14;color:#e9e2d6;font:14px/1.8 Arial,"Microsoft YaHei",sans-serif}main{max-width:1500px;margin:auto;padding:25px}h1,h2{font-weight:400}a{color:#d9c097}nav{display:flex;gap:20px;flex-wrap:wrap}button{font:inherit;color:#e9e2d6;border:1px solid #59616c;background:#18212c;padding:8px 16px;cursor:pointer}button:focus-visible{outline:2px solid #cfb58c}p{color:#b4c0cc}.controls{display:flex;gap:12px;align-items:center;margin:20px 0}.viewport{width:100%;overflow:hidden;background:#03070b}.holder{position:relative;margin:auto;overflow:hidden}iframe{border:0;display:block;transform-origin:top left}.videos{display:grid;grid-template-columns:3fr 1fr;gap:20px}video{width:100%;max-height:85vh;background:#03070b}section{margin:40px 0}.assets{display:flex;gap:16px;flex-wrap:wrap}@media(max-width:700px){.videos{grid-template-columns:1fr}main{padding:16px}}</style></head><body><main><small>独立开发样片 · 未替换首页 · 未发布 · 等待艺术验收</small><h1>水面 / 光路 · 局部独立素材样片</h1><nav><a href="?effect=water&device=desktop">水面 · 桌面</a><a href="?effect=water&device=mobile">水面 · 手机</a><a href="?effect=light&device=desktop">光路 · 桌面</a><a href="?effect=light&device=mobile">光路 · 手机</a><a id="full" target="_blank">打开无调试界面的原尺寸样片 ↗</a><a href="http://127.0.0.1:4177/" target="_blank">当前稳定网站 ↗</a></nav><div class="controls"><button data-mode="off">局部动态关闭</button><button data-mode="on">局部动态开启</button><button data-mode="static">完全静态</button><span id="state">正常速度 · 开启</span></div><p>前两个按钮只切换当前局部样片，原云雾继续运行；完全静态关闭两者。控件只在此验收外壳，正常样片页面没有调试控件。</p><div class="viewport"><div class="holder"><iframe title="独立素材实时样片"></iframe></div></div><div id="media"></div></main><script>
const q=new URLSearchParams(location.search),effect=q.get('effect')==='light'?'light':'water',device=q.get('device')==='mobile'?'mobile':'desktop',width=device==='mobile'?390:1440,height=device==='mobile'?844:900,frame=document.querySelector('iframe');frame.src='./?effect='+effect;frame.width=width;frame.height=height;document.querySelector('#full').href=frame.src;function fit(){const scale=Math.min(1,document.querySelector('.viewport').clientWidth/width);document.querySelector('.holder').style.cssText='width:'+width*scale+'px;height:'+height*scale+'px';frame.style.transform='scale('+scale+')'}addEventListener('resize',fit);fit();for(const b of document.querySelectorAll('button[data-mode]'))b.onclick=()=>{frame.contentWindow.postMessage({type:'sample-mode',mode:b.dataset.mode},location.origin);document.querySelector('#state').textContent=b.textContent+' · 正常速度'};const root='../artifacts/material-samples/accepted-candidate/',asset='../public/art/material-samples/';document.querySelector('#media').innerHTML=['water','light'].map(e=>'<section><h2>'+(e==='water'?'水面':'丁达尔光')+' · 正常速度无调试实录</h2><div class="videos"><video controls preload="metadata" src="'+root+'desktop-'+e+'-normal.mp4"></video><video controls preload="metadata" src="'+root+'mobile-'+e+'-normal.mp4"></video></div><p><a href="'+root+'desktop-'+e+'-compare.mp4">桌面关闭 / 开启对比</a> · <a href="'+root+'mobile-'+e+'-compare.mp4">手机关闭 / 开启对比</a></p><div class="assets">'+['desktop','mobile'].map(d=>'<a href="/art/material-samples/'+d+'-'+e+'/base.webp" target="_blank">'+d+' 局部底图</a><a href="/art/material-samples/'+d+'-'+e+'/boundary.png" target="_blank">'+d+' 边界遮罩</a><a href="/art/material-samples/'+d+'-'+e+'/reflection-positive.webp" target="_blank">'+d+' 独立正反射/光贡献</a><a href="/art/material-samples/'+d+'-'+e+'/reflection-negative.webp" target="_blank">'+d+' 独立负差分</a>').join('')+'</div></section>').join('');
</script></body></html>
