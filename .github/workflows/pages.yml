name: Website checks and reviewed Pages deployment
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:security
      - run: npm run test:maintenance
      - name: Check official npm registry connectivity
        shell: bash
        run: |
          node -e "for (const k of ['HTTP_PROXY','HTTPS_PROXY','ALL_PROXY','NPM_CONFIG_PROXY','NPM_CONFIG_HTTPS_PROXY']) console.log(k+' configured: '+Boolean(process.env[k])); require('node:dns').lookup('registry.npmjs.org',{all:true},(e,a)=>{console.log('Registry DNS: '+(e?e.code:a.length+' addresses'));});"
          if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 https://registry.npmjs.org/-/ping > /dev/null; then
            echo 'Official registry TLS/ping reachable; this does not certify the audit API.'
          else
            echo 'Registry connectivity probe failed; the mandatory audit below still decides the result.'
          fi
      - name: Audit dependencies with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/npm-audit-result.json"
          for attempt in 1 2 3; do
            echo "Mandatory npm audit attempt $attempt/3"
            npm_status=0
            timeout --signal=TERM --kill-after=5s 90s npm audit --audit-level=low --registry=https://registry.npmjs.org/ --fetch-timeout=60000 --fetch-retries=0 --json > "$report" || npm_status=$?
            result=0
            node -e '
              const fs = require("node:fs");
              let r;
              try { r = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); } catch { process.exit(2); }
              const v = r.metadata?.vulnerabilities;
              const levels = ["info", "low", "moderate", "high", "critical"];
              if (r.error || r.auditReportVersion !== 2 || !r.vulnerabilities || !v || ![...levels, "total"].every(k => Number.isSafeInteger(v[k]) && v[k] >= 0) || levels.reduce((n,k) => n + v[k], 0) !== v.total) process.exit(2);
              console.log("Valid npm audit report: " + v.total + " vulnerabilities");
              process.exit(v.total > 0 ? 1 : 0);
            ' "$report" || result=$?
            if [ "$result" -eq 1 ]; then
              echo '::error::Audit found vulnerabilities; deployment is blocked.'
              exit 1
            fi
            if [ "$result" -eq 0 ] && [ "$npm_status" -eq 0 ]; then
              echo 'Mandatory audit passed with a valid zero-vulnerability report.'
              exit 0
            fi
            echo "Audit unavailable or invalid (npm exit $npm_status, report validation $result)."
            if [ "$attempt" -lt 3 ]; then
              delay=$((10 * (2 * attempt - 1)))
              echo "Retrying in $delay seconds."
              sleep "$delay"
            fi
          done
          echo '::error::No successful valid audit after 3 attempts; deployment remains blocked.'
          exit 1
      - run: npm run test:browser:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview-${{ github.sha }}
          path: dist
          retention-days: 14
          include-hidden-files: true
      - name: Package approved main build for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.MILOQEN_PAGES_APPROVED == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    name: Deploy reviewed main
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.MILOQEN_PAGES_APPROVED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify deployed public pages without changing publication rules
        run: |
          for path in / /works/ /philosophy/ /about/ /journal/ /contact/; do
            curl --fail --silent --show-error --retry 3 --retry-delay 5 "https://loraine-dev.github.io$path" > /dev/null || exit 1
          done
