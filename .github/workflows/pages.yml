name: Website checks and reviewed Pages deployment
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:browser:ci
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview-${{ github.sha }}
          path: dist
          retention-days: 14
      - name: Package approved main build for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.MILOQEN_PAGES_APPROVED == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    name: Deploy reviewed main
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.MILOQEN_PAGES_APPROVED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
