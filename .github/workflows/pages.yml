name: Publish reviewed website
# No push trigger. Run only after the owner approves the exact commit.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: '输入 MILOQEN-PUBLISH，确认已完成本次视觉与功能验收'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: inputs.confirmation == 'MILOQEN-PUBLISH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: node --test tests/site-build.test.mjs
      - run: npm run test:release
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved build
        id: deployment
        uses: actions/deploy-pages@v4
