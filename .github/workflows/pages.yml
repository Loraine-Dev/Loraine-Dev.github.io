name: Website checks and reviewed Pages deployment
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:security
      - run: npm run test:maintenance
      - run: npm audit --audit-level=low
      - run: npm run test:browser:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-preview-${{ github.sha }}
          path: dist
          retention-days: 14
          include-hidden-files: true
      - name: Package approved main build for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.MILOQEN_PAGES_APPROVED == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    name: Deploy reviewed main
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.MILOQEN_PAGES_APPROVED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify deployed public pages without changing publication rules
        run: |
          for path in / /works/ /philosophy/ /about/ /journal/ /contact/; do
            curl --fail --silent --show-error --retry 3 --retry-delay 5 "https://loraine-dev.github.io$path" > /dev/null || exit 1
          done
