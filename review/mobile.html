<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>MILOQEN 手机原型预览 · 390 × 844</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        background: #10141c;
        color: #d9dee7;
        font:
          12px Arial,
          "Microsoft YaHei",
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 25px;
      }
      header {
        display: flex;
        gap: 25px;
        justify-content: space-between;
        width: min(100%, 550px);
        align-items: center;
      }
      a {
        color: #cbb58f;
        text-decoration: none;
      }
      .phone {
        transform: scale(var(--scale, 1));
        transform-origin: top center;
        margin-bottom: calc(864px * (var(--scale, 1) - 1));
        width: 410px;
        height: 864px;
        padding: 10px;
        background: #05070b;
        border: 1px solid #4b5261;
        border-radius: 30px;
        box-shadow: 0 30px 90px #0006;
      }
      iframe {
        border: 0;
        width: 390px;
        height: 844px;
        border-radius: 20px;
        background: #070b12;
      }
      p {
        font-size: 10px;
        color: #8e9aab;
        line-height: 1.8;
      }
      @media (max-width: 460px) {
        body {
          padding: 12px;
          gap: 12px;
        }
        .phone {
        }
        header {
          font-size: 10px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span>手机原型预览 · 390 × 844</span
      ><a href="/review/desktop.html" target="_blank" rel="noopener"
        >打开桌面预览 ↗</a
      >
    </header>
    <div class="phone">
      <iframe title="MILOQEN 手机首页原型" src="/?study=tidal-mobile"></iframe>
    </div>
    <p>可在画面内滚动，查看进入世界的镜头。此页面仅用于本地美术验收。</p>
    <script>
      function fit() {
        document.documentElement.style.setProperty(
          "--scale",
          Math.max(
            0.1,
            Math.min(1, (innerWidth - 50) / 410, (innerHeight - 130) / 864),
          ),
        );
      }
      addEventListener("resize", fit);
      fit();
    </script>
  </body>
</html>
