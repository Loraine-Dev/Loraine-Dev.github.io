<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>MILOQEN 桌面原型预览 · 1440 × 900</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        background: #10141c;
        color: #d9dee7;
        font:
          12px Arial,
          "Microsoft YaHei",
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 20px;
      }
      header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        gap: 15px;
      }
      a {
        color: #cbb58f;
        text-decoration: none;
      }
      .frame {
        overflow: hidden;
        width: calc(1440px * var(--scale, 0.35));
        height: calc(900px * var(--scale, 0.35));
        box-shadow: 0 20px 80px #0007;
      }
      iframe {
        width: 1440px;
        height: 900px;
        border: 0;
        transform: scale(var(--scale, 0.35));
        transform-origin: top left;
      }
      p {
        color: #8e9aab;
        font-size: 10px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <span>桌面原型 · 1440 × 900</span
      ><a href="/" target="_blank" rel="noopener">打开自适应原页 ↗</a>
    </header>
    <div class="frame">
      <iframe title="MILOQEN 桌面首页原型" src="/?study=tidal-desktop"></iframe>
    </div>
    <p>可在画面内滚动。缩放展示真实桌面视口，仅供本地验收。</p>
    <script>
      function fit() {
        document.documentElement.style.setProperty(
          "--scale",
          Math.max(
            0.1,
            Math.min(1, (innerWidth - 40) / 1440, (innerHeight - 120) / 900),
          ),
        );
      }
      addEventListener("resize", fit);
      fit();
    </script>
  </body>
</html>
