<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MILOQEN · 首页动态最终整改验收</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #05090e;
        color: #e9e1d2;
        font:
          13px/1.5 Arial,
          "Microsoft YaHei",
          sans-serif;
      }
      header {
        min-height: 54px;
        padding: 10px 18px;
        display: flex;
        gap: 18px;
        align-items: center;
        flex-wrap: wrap;
      }
      a {
        color: inherit;
      }
      main {
        display: flex;
        justify-content: center;
        min-height: calc(100vh - 54px);
      }
      iframe {
        border: 0;
        width: 1440px;
        height: 900px;
        max-width: 100vw;
        flex: none;
        box-shadow: 0 0 0 1px #68707a44;
      }
      .mobile iframe {
        width: 390px;
        height: 844px;
      }
      .desktop iframe {
        width: 1440px;
        height: 900px;
      }
      small {
        color: #a1afb8;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>首页动态 · 待艺术验收</strong
      ><a href="?device=desktop">桌面 1440×900</a
      ><a href="?device=mobile">手机 390×844</a
      ><a href="/?motionMode=all" target="_blank">原页 ↗</a
      ><small>画面左下六项独立开关 · 正常速度 · 未发布</small>
    </header>
    <main>
      <iframe title="MILOQEN 首页动态实时验收" src="/?motionMode=all"></iframe>
    </main>
    <script>
      document.body.className =
        new URLSearchParams(location.search).get("device") === "mobile"
          ? "mobile"
          : "desktop";
    </script>
    <script>
      // Scale the preview frame, not its viewport: desktop stays 1440px wide
      // even when the Codex side panel itself is narrow.
      function fitPreview() {
        const mobile = document.body.classList.contains("mobile");
        const width = mobile ? 390 : 1440,
          height = mobile ? 844 : 900;
        const scale = Math.min(1, innerWidth / width);
        const main = document.querySelector("main"),
          frame = document.querySelector("iframe");
        Object.assign(main.style, {
          width: `${width * scale}px`,
          height: `${height * scale}px`,
          minHeight: "0",
          position: "relative",
          margin: "0 auto",
        });
        Object.assign(frame.style, {
          position: "absolute",
          left: "0",
          top: "0",
          width: `${width}px`,
          height: `${height}px`,
          maxWidth: "none",
          transformOrigin: "top left",
          transform: `scale(${scale})`,
        });
      }
      addEventListener("resize", fitPreview);
      fitPreview();
    </script>
  </body>
</html>
